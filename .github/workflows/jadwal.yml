name: Anime Tracker Bot

on:
  schedule:
    # Menjalankan script setiap jam 01:00 UTC (Sama dengan jam 08:00 WIB)
    - cron: "0 1 * * *"
  workflow_dispatch: # Mengizinkan kita mengeksekusi bot secara manual via tombol di web

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Mengambil kode dari repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Jalankan bot athrun.py
        env:
          # Mengambil URL dari GitHub Secrets dan menyuapkannya ke script Python
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python athrun.py
